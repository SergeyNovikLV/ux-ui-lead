name: Portfolio PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser:
    name: Build and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:qa
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-evidence
          path: qa-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
